name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X11 dev headers (softbuffer's x11 feature)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libx11-dev libx11-xcb-dev
      - run: cargo test

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes -p typescript@5.9.3 tsc -p userland --noEmit
      - run: npx --yes -p typescript@5.9.3 tsc -p kernel/runtime_modules --noEmit

  generated:
    name: generated tables in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X11 dev headers (softbuffer's x11 feature)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libx11-dev libx11-xcb-dev
      # `touch` forces the build script's `rerun-if-changed` triggers so the
      # palette/keycode tables are regenerated from `build/{palette,keys}.rs`
      # even on a warm cache; the diff then fails if a committed copy is stale
      # (or was hand-edited).
      - run: touch build/palette.rs build/keys.rs build/splice.rs && cargo build
      - run: git diff --exit-code -- kernel/runtime_modules/framebuffer.ts kernel/runtime_modules/input.ts userland/elysium.d.ts

  package:
    name: package (${{ matrix.os }})
    needs: [test, typecheck, generated]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: elysium-linux-x86_64
            bin: elysium
          - os: windows-latest
            artifact: elysium-windows-x86_64
            bin: elysium.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X11 dev headers (softbuffer's x11 feature)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libx11-dev libx11-xcb-dev
      - run: cargo build --release
      - name: zip
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.bin }} dist/
          cp -r target/release/userland dist/
          cd dist && 7z a ../${{ matrix.artifact }}.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          files: dist/*/*.zip
