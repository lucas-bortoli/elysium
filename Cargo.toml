[package]
name = "elysium-os"
version = "0.1.0"
edition = "2024"

[lib]
name = "elysium_os"
path = "kernel/lib.rs"

[[bin]]
name = "elysium"
path = "kernel/main.rs"

[[bench]]
name = "vm_lifecycle"
harness = false

[[bench]]
name = "program_eval"
harness = false

[[bench]]
name = "bouncing_objects"
harness = false

[[bench]]
name = "rasterize"
harness = false

[[bench]]
name = "frame_tick"
harness = false

[[bench]]
name = "palette"
harness = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
rquickjs = { version = "0.12.2", features = ["loader"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "wayland"] }
swc_common = "26.0.0"
swc_ecma_ast = "29.0.0"
swc_ecma_parser = "45.0.0"
swc_ecma_visit = "29.0.0"
tiny-skia = "0.11.4"
winit = "0.30.13"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }
